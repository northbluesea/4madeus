name: Release Binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: 4madeus
            out: 4madeus-linux-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: 4madeus
            out: 4madeus-darwin-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            bin: 4madeus
            out: 4madeus-darwin-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: 4madeus.exe
            out: 4madeus-win32-x64.exe

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --bin 4madeus --target ${{ matrix.target }}
      - shell: bash
        run: cp target/${{ matrix.target }}/release/${{ matrix.bin }} ${{ matrix.out }}
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.out }}
